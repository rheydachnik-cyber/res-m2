<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Звуки природы</title>
</head>
<body>
  <div class="app">
    <h1 class="app__title">Звуки природы</h1>

    <div class="volume">
      <label for="volume" class="volume__label">Громкость</label>
      <input
        id="volume"
        class="volume__range"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
      />
    </div>

    <div class="buttons" id="buttons"></div>
  </div>
</body>
</html>
